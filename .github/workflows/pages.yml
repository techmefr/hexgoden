name: Pages

on:
  push:
    branches: [main]
    paths:
      - design/mockups/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/mockups
          cp -r design/mockups/. _site/mockups/
          rm -rf _site/mockups/screenshots
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=mockups/"><title>HexGoden</title><a href="mockups/">Mockups</a>\n' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
